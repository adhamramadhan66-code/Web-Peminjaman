<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk ke Peminjaman Ruangan | TSU</title>
<script>
  // Terapkan tema tersimpan (kunci "theme", sama dengan halaman dalam) sebelum halaman digambar.
  try { document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark'; }
  catch (e) { document.documentElement.dataset.theme = 'dark'; }
</script>
<style>
  :root {
    --forest: #2E9E68;
    --forest-dark: #1F7A4D;
    --dark-bg: #0F1A15;
    --dark-surface: #18261F;
    --dark-line: #2A3A32;
    --cream: #F1EFE9;
    --ink: #EDF2EE;
    --ink-soft: #93A39A;
    --amber: #F2A93B;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --card: #121D17;
    --field-focus: #1E2E26;
    --placeholder: #6E7D75;
    --faint: #4E5C55;
    --err-fg: #ff9b9b;
    --ok-fg: #7de0ad;
    --demo-bg: rgba(255,255,255,.025);
    --link-hover: #4CC98A;
    --shadow: 0 24px 60px -28px rgba(0,0,0,.65);
    color-scheme: dark;
  }
  /* Tema terang: nilai-nilai ini memakai ulang nama variabel gelap supaya seluruh halaman ikut berubah. */
  :root[data-theme="light"] {
    --dark-bg: #F3F6F4;
    --dark-surface: #F6F8F7;
    --dark-line: #D6DDD9;
    --ink: #1B2A22;
    --ink-soft: #5F6F66;
    --card: #FFFFFF;
    --field-focus: #FFFFFF;
    --placeholder: #9AA8A0;
    --faint: #8A978F;
    --err-fg: #B42318;
    --ok-fg: #1F7A4D;
    --demo-bg: #F6F8F7;
    --link-hover: #1F7A4D;
    --shadow: 0 24px 60px -30px rgba(20,40,30,.28);
    color-scheme: light;
  }

  * { box-sizing: border-box; }

  /* ============================================================
     KEYFRAMES
     ============================================================ */
  @keyframes fadeUp {
    from { opacity: 0; transform: translate3d(0, 22px, 0); }
    to   { opacity: 1; transform: translate3d(0, 0, 0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; } to { opacity: 1; }
  }
  @keyframes floatUp {
    0%   { transform: translate3d(0, 0, 0) scale(.5);      opacity: 0; }
    12%  { opacity: .85; }
    85%  { opacity: .35; }
    100% { transform: translate3d(40px, -110vh, 0) scale(1.15); opacity: 0; }
  }
  @keyframes growLine {
    from { width: 0;    opacity: 0; }
    to   { width: 64px; opacity: 1; }
  }
  @keyframes lineGrow {
    from { transform: scaleX(0); }
    to   { transform: scaleX(1); }
  }
  @keyframes pulseRing {
    0%   { box-shadow: 0 0 0 0 rgba(46,158,104,.45); }
    70%  { box-shadow: 0 0 0 12px rgba(46,158,104,0); }
    100% { box-shadow: 0 0 0 0 rgba(46,158,104,0); }
  }
  @keyframes shine {
    0%   { transform: translateX(-160%) skewX(-20deg); }
    55%  { transform: translateX(340%)  skewX(-20deg); }
    100% { transform: translateX(340%)  skewX(-20deg); }
  }
  @keyframes rippleAnim {
    to { transform: scale(2.6); opacity: 0; }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes wiggle {
    0%, 100% { transform: rotate(0) scale(1); }
    30%      { transform: rotate(-9deg) scale(1.12); }
    65%      { transform: rotate(9deg)  scale(1.12); }
  }

  body {
    margin: 0;
    font-family: 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--dark-bg);
    color: var(--ink);
    overflow-x: hidden;
    transition: background-color .25s ease, color .25s ease;
  }

  .page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ---------- Kartu login di tengah halaman ---------- */
  .auth {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    position: relative;
    z-index: 5;
  }

  .auth-card {
    width: 100%;
    max-width: 420px;
    padding: 34px 32px 28px;
    background: var(--card);
    border: 1px solid var(--dark-line);
    border-radius: 18px;
    box-shadow: var(--shadow);
    transition: background-color .25s ease, border-color .25s ease;
  }
  @media (max-width: 480px) { .auth-card { padding: 28px 20px 22px; } }

  /* ---------- Tombol tema gelap/terang (pojok kanan atas) ---------- */
  .theme-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 10;
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    border: 1px solid var(--dark-line);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
    transition: color .2s ease, border-color .2s ease, background-color .25s ease, transform .12s ease;
  }
  .theme-toggle:hover { color: var(--forest); border-color: var(--forest); }
  .theme-toggle:active { transform: scale(.94); }
  .theme-toggle:focus-visible { outline: 2px solid var(--forest); outline-offset: 2px; }
  .theme-toggle svg { width: 20px; height: 20px; }
  /* bulan tampil di tema terang, matahari di tema gelap (sama seperti halaman dalam) */
  :root:not([data-theme="light"]) .theme-toggle .icon-moon { display: none; }
  :root[data-theme="light"] .theme-toggle .icon-sun { display: none; }

  .brand, h2, .sso-row, .divider, .field,
  .row-between, .btn-primary, .signup, .terms, .copyright {
    animation: fadeUp .7s var(--ease-out) both;
  }

  .brand      { animation-delay: .05s; }
  h2          { animation-delay: .15s; }
  .sso-row    { animation-delay: .25s; }
  .divider    { animation-delay: .35s; }
  .field:nth-child(1) { animation-delay: .45s; }
  .field:nth-child(2) { animation-delay: .55s; }
  .row-between{ animation-delay: .65s; }
  .btn-primary{ animation-delay: .75s; }
  .signup     { animation-delay: .85s; }

  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 24px;
  }

  .brand-mark {
    position: relative;
    width: 34px;
    height: 34px;
    border-radius: 9px;
    background: var(--forest);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .25s var(--ease-out), background .25s ease;
  }
  .brand-mark:hover { transform: rotate(-6deg) scale(1.06); }
  .brand-mark::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 9px;
    animation: pulseRing 2.8s ease-out infinite;
  }
  .brand-mark svg { width: 18px; height: 18px; }

  .brand-name {
    font-size: 19px;
    font-weight: 700;
    color: var(--ink);
  }

  h2 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 22px 0;
    text-align: center;
    color: var(--ink);
  }

  .sso-row {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 22px;
  }

  .sso-row .sso-btn {
    flex: 0 0 auto;
    min-width: 160px;
  }

  .sso-btn {
    position: relative;
    overflow: hidden;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 11px 10px;
    border: 1px solid var(--dark-line);
    border-radius: 10px;
    background: var(--dark-surface);
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
    transition: border-color .2s ease, box-shadow .25s ease, transform .12s ease, background .2s ease;
  }
  .sso-btn:hover {
    border-color: var(--forest);
    background: var(--field-focus);
    box-shadow: 0 6px 16px -8px rgba(46,158,104,.5);
    transform: translateY(-1px);
  }
  .sso-btn:active { transform: scale(0.98); }
  .sso-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
  .sso-btn:hover svg { animation: wiggle .55s ease; }
  .sso-btn .ripple { background: rgba(46,158,104,.22); }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 4px 0 22px 0;
    color: var(--ink-soft);
    font-size: 12px;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--dark-line);
    transform: scaleX(0);
    animation: lineGrow .9s var(--ease-out) .55s forwards;
  }
  .divider::before { transform-origin: right center; }
  .divider::after  { transform-origin: left center;  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-soft);
    margin-bottom: 6px;
    transition: color .2s ease, transform .2s ease;
  }

  .field { margin-bottom: 16px; }
  .field:focus-within label {
    color: var(--forest);
    transform: translateX(2px);
  }

  .input-wrap { position: relative; }

  .input-wrap svg {
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    color: var(--ink-soft);
    transition: color .2s ease, transform .25s var(--ease-out);
    pointer-events: none;
  }
  .input-wrap:focus-within svg {
    color: var(--forest);
    transform: translateY(-50%) scale(1.15);
  }

  input[type="email"],
  input[type="password"] {
    width: 100%;
    padding: 12px 14px 12px 38px;
    border: 1px solid var(--dark-line);
    border-radius: 10px;
    font-size: 14px;
    background: var(--dark-surface);
    color: var(--ink);
    outline: none;
    transition: border-color .2s ease, box-shadow .25s ease, background .2s ease;
  }

  input::placeholder { color: var(--placeholder); transition: opacity .2s ease, transform .2s ease; }
  input:focus::placeholder { opacity: .55; }

  input:focus {
    border-color: var(--forest);
    box-shadow: 0 0 0 3px rgba(46, 158, 104, 0.22);
    background: var(--field-focus);
  }

  .row-between {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 22px;
  }

  .link {
    position: relative;
    font-size: 13px;
    color: var(--forest);
    text-decoration: none;
    font-weight: 500;
    transition: color .2s ease;
  }
  .link::after {
    content: "";
    position: absolute;
    left: 0; bottom: -2px;
    width: 100%; height: 1px;
    background: currentColor;
    transform: scaleX(0);
    transform-origin: right center;
    transition: transform .3s var(--ease-out);
  }
  .link:hover::after {
    transform: scaleX(1);
    transform-origin: left center;
  }
  .link:hover { color: var(--link-hover); }

  .btn-primary {
    position: relative;
    overflow: hidden;
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: var(--forest);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background .2s ease, transform .12s ease, box-shadow .25s ease;
  }
  .btn-primary:hover {
    background: #3CB878;
    box-shadow: 0 10px 22px -12px rgba(46, 158, 104, .9);
    transform: translateY(-1px);
  }
  .btn-primary:active { transform: scale(0.99); }

  .btn-primary::after {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 40%;
    height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.25), transparent);
    transform: translateX(-160%) skewX(-20deg);
    animation: shine 4s ease-in-out infinite;
    pointer-events: none;
  }

  .btn-label { transition: opacity .2s ease; }

  .spinner {
    display: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.35);
    border-top-color: #fff;
  }
  .btn-primary.loading { pointer-events: none; }
  .btn-primary.loading .spinner {
    display: block;
    animation: spin .7s linear infinite;
  }
  .btn-primary.loading .btn-label { opacity: .75; }

  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,.4);
    transform: scale(0);
    animation: rippleAnim .65s ease-out forwards;
    pointer-events: none;
  }

  .signup {
    text-align: center;
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 20px;
  }
  .signup a {
    position: relative;
    color: var(--forest);
    font-weight: 600;
    text-decoration: none;
  }
  .signup a::after {
    content: "";
    position: absolute;
    left: 0; bottom: -2px;
    width: 100%; height: 1.5px;
    background: currentColor;
    transform: scaleX(0);
    transform-origin: right center;
    transition: transform .3s var(--ease-out);
  }
  .signup a:hover::after {
    transform: scaleX(1);
    transform-origin: left center;
  }
  .signup a:hover { color: var(--link-hover); }

  .terms {
    text-align: center;
    font-size: 11.5px;
    color: var(--ink-soft);
    margin-top: 14px;
    line-height: 1.5;
  }
  .terms a { color: var(--ink-soft); text-decoration: underline; }

  .copyright {
    text-align: center;
    font-size: 11px;
    color: var(--faint);
    margin-top: 26px;
  }

  .login-message {
    display: none;
    margin: 0 0 14px;
    padding: 10px 12px;
    border: 1px solid rgba(239, 68, 68, .35);
    border-radius: 8px;
    background: rgba(239, 68, 68, .09);
    color: var(--err-fg);
    font-size: 12.5px;
    line-height: 1.45;
  }
  .login-message.show { display: block; }
  .login-message.success {
    border-color: rgba(46, 158, 104, .4);
    background: rgba(46, 158, 104, .1);
    color: var(--ok-fg);
  }
  .demo-account {
    margin-top: 12px;
    padding: 10px 12px;
    border: 1px solid var(--dark-line);
    border-radius: 9px;
    background: var(--demo-bg);
    font-size: 12px;
  }
  .demo-account strong { color: var(--ink); font-weight: 600; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
  }
</style>
</head>
<body>
  <button class="theme-toggle" type="button" id="themeToggle" aria-label="Ganti tema gelap/terang" title="Ganti tema">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
  </button>

  <div class="page">

    <!-- KARTU LOGIN (di tengah) -->
    <div class="auth">
      <div class="auth-card">
        <div class="brand">
          <div class="brand-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
              <path d="M6 12v5c3 3 9 3 12 0v-5"/>
            </svg>
          </div>
          <span class="brand-name">Peminjaman Ruangan</span>
        </div>

        <h2>Masuk ke akunmu</h2>

        <div class="sso-row">
          <button class="sso-btn" type="button">
            <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.4 29.4 35.5 24 35.5 16.5 35.5 10.5 29.5 10.5 22S16.5 8.5 24 8.5c3.6 0 6.8 1.4 9.3 3.6l5.7-5.7C35.6 3 30.1 1 24 1 11.8 1 2 10.8 2 23s9.8 22 22 22c11.3 0 21-8.2 21-22 0-1.5-.2-2.5-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.8 19 12.5 24 12.5c3.6 0 6.8 1.4 9.3 3.6l5.7-5.7C35.6 6.5 30.1 4.5 24 4.5c-7.4 0-13.8 4.1-17.1 10.2z"/><path fill="#4CAF50" d="M24 44.5c6 0 11.3-2 15-5.6l-6.9-5.7c-2 1.5-4.7 2.3-8.1 2.3-5.3 0-9.8-3.6-11.3-8.5l-6.7 5.2C9.2 39.8 16 44.5 24 44.5z"/><path fill="#1976D2" d="M43.6 20.5H24v8h11.3c-.9 2.9-2.9 5.1-5.4 6.7l6.9 5.7C41 37.5 44 30.9 44 23c0-1.5-.2-2.5-.4-2.5z"/></svg>
            Google
          </button>
        </div>

        <div class="divider">atau</div>

        <p id="loginMessage" class="login-message" role="alert" aria-live="polite"></p>

        <form novalidate>
          <div class="field" id="nameField" hidden>
            <label for="fullname">Nama lengkap</label>
            <div class="input-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <input type="text" id="fullname" placeholder="Nama lengkap" autocomplete="name" maxlength="80">
            </div>
          </div>

          <div class="field">
            <label for="email">Alamat email</label>
            <div class="input-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg>
              <input type="email" id="email" placeholder="nama@contoh.com" autocomplete="email">
            </div>
          </div>

          <div class="field">
            <label for="password">Kata sandi</label>
            <div class="input-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
              <input type="password" id="password" placeholder="Masukkan kata sandi" autocomplete="current-password">
            </div>
          </div>

          <div class="row-between">
            <a href="#" class="link">Lupa kata sandi?</a>
          </div>

          <button class="btn-primary" type="submit">
            <span class="btn-label">Masuk</span>
            <span class="spinner" aria-hidden="true"></span>
          </button>
        </form>

        <p class="signup"><span id="modeTeks">Belum punya akun?</span> <a href="#" id="modeLink">Daftar</a></p>
        <p class="terms demo-account">Akun demo admin: <strong>admin@tsu.ac.id</strong><br>Akun demo pengguna: <strong>mahasiswa@tsu.ac.id</strong><br>Kata sandi keduanya: <strong>tsu12345</strong></p>

      </div>
    </div>

  </div>

<script>
  (function () {
    const SESSION_KEY = 'kampuslyCurrentUser';

    // Tema gelap/terang: kunci 'theme' di localStorage sama dengan halaman dalam, jadi pilihan ikut terbawa.
    const rootEl = document.documentElement, tombolTema = document.getElementById('themeToggle');
    const syncTema = function () {
      const gelap = rootEl.dataset.theme !== 'light';
      tombolTema.setAttribute('aria-pressed', String(gelap));
      tombolTema.title = gelap ? 'Ganti ke tema terang' : 'Ganti ke tema gelap';
    };
    syncTema();
    tombolTema.addEventListener('click', function () {
      rootEl.dataset.theme = rootEl.dataset.theme === 'light' ? 'dark' : 'light';
      try { localStorage.setItem('theme', rootEl.dataset.theme); } catch (e) {}
      syncTema();
    });

    const form = document.querySelector('form');
    const submitBtn = form.querySelector('.btn-primary');
    const message = document.getElementById('loginMessage');

    function showMessage(text, type) {
      message.textContent = text;
      message.className = 'login-message show' + (type === 'success' ? ' success' : '');
    }

    // Jika sesi demo masih aktif, langsung buka dashboard.
    try {
      if (sessionStorage.getItem(SESSION_KEY)) {
        window.location.replace('dashboard.html');
        return;
      }
    } catch (error) {
      showMessage('Penyimpanan sesi browser tidak tersedia. Coba buka proyek lewat server lokal.', 'error');
    }

    document.querySelectorAll('.btn-primary, .sso-btn').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        const rect = btn.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        const ripple = document.createElement('span');
        ripple.className = 'ripple';
        ripple.style.width = ripple.style.height = size + 'px';
        ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
        ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
        btn.appendChild(ripple);
        setTimeout(function () { ripple.remove(); }, 650);
      });
    });

    // ---- mode Masuk / Daftar ----
    let modeDaftar = false;
    const nameField = document.getElementById('nameField');
    const judul = document.querySelector('.auth-card h2');
    const labelBtn = submitBtn.querySelector('.btn-label');
    const modeTeks = document.getElementById('modeTeks');
    const modeLink = document.getElementById('modeLink');
    const passInput = document.getElementById('password');
    function setMode(daftar) {
      modeDaftar = daftar;
      nameField.hidden = !daftar;
      judul.textContent = daftar ? 'Buat akun baru' : 'Masuk ke akunmu';
      labelBtn.textContent = daftar ? 'Daftar' : 'Masuk';
      modeTeks.textContent = daftar ? 'Sudah punya akun?' : 'Belum punya akun?';
      modeLink.textContent = daftar ? 'Masuk' : 'Daftar';
      passInput.placeholder = daftar ? 'Minimal 8 karakter' : 'Masukkan kata sandi';
      passInput.setAttribute('autocomplete', daftar ? 'new-password' : 'current-password');
      const lupa = document.querySelector('.row-between .link');
      if (lupa) lupa.style.visibility = daftar ? 'hidden' : '';
      message.textContent = '';
      message.className = 'login-message';
    }
    modeLink.addEventListener('click', function (e) { e.preventDefault(); setMode(!modeDaftar); });

    // ---- kirim ke server (api/auth.php): login atau daftar ----
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      if (submitBtn.classList.contains('loading')) return;

      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = passInput.value;
      const nama = document.getElementById('fullname').value.trim();
      if (!email || !password || (modeDaftar && !nama)) {
        showMessage(modeDaftar ? 'Isi nama lengkap, alamat email, dan kata sandi terlebih dahulu.'
                               : 'Masukkan alamat email dan kata sandi terlebih dahulu.');
        return;
      }

      submitBtn.classList.add('loading');
      const payload = modeDaftar ? { aksi: 'daftar', nama: nama, email: email, sandi: password }
                                 : { aksi: 'masuk', email: email, sandi: password };
      let res = null, data = null;
      try {
        res = await fetch('api/auth.php', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        try { data = await res.json(); } catch (err) {}
      } catch (err) {
        submitBtn.classList.remove('loading');
        showMessage('Tidak dapat terhubung ke server. Buka lewat Laragon/XAMPP (http://localhost/...) atau jalankan.bat.');
        return;
      }
      if (!res.ok || !data || !data.pengguna) {
        submitBtn.classList.remove('loading');
        showMessage((data && data.error) || 'Server PHP tidak aktif. Buka lewat Laragon/XAMPP (http://localhost/...) atau jalankan.bat.');
        return;
      }

      try {
        sessionStorage.setItem(SESSION_KEY, JSON.stringify({
          id: data.pengguna.id,
          email: data.pengguna.email,
          name: data.pengguna.nama,
          peran: data.pengguna.peran
        }));
      } catch (error) {
        submitBtn.classList.remove('loading');
        showMessage('Sesi tidak dapat disimpan oleh browser. Jalankan lewat localhost atau Live Server.');
        return;
      }
      showMessage((modeDaftar ? 'Akun berhasil dibuat. ' : 'Login berhasil. ') + 'Membuka dashboard...', 'success');
      setTimeout(function () {
        window.location.replace('dashboard.html');
      }, 500);
    });

    document.querySelector('.sso-btn').addEventListener('click', function () {
      showMessage('Login Google belum dihubungkan pada prototipe ini. Gunakan akun yang sudah terdaftar.');
    });
    const forgotLink = document.querySelector('.row-between .link');
    if (forgotLink) forgotLink.addEventListener('click', function (e) {
      e.preventDefault();
      showMessage('Fitur lupa kata sandi belum tersedia pada prototipe demo ini.');
    });
  })();
</script>
</body>
</html>
